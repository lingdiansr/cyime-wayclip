name: Release
on:
 push:
  tags: ["v*"]
permissions:
 contents: write
jobs:
 linux:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: dtolnay/rust-toolchain@1.85.0
   - name: Install packaging tools
     run: sudo apt-get update && sudo apt-get install -y dpkg-dev rpm
   - name: Build binary
     run: cargo build --release --all-features
   - name: Build packages
     shell: bash
     run: |
      set -euo pipefail
      version="${GITHUB_REF_NAME#v}"
      mkdir -p dist
      artifact="cyime-wayclip_${version}_x86_64"
      root="$artifact"
      mkdir -p "$root/usr/bin" "$root/usr/share/cyime-wayclip" "$root/usr/lib/systemd/user"
      install -m755 target/release/cyime-wayclip "$root/usr/bin/"
      install -m644 README.md packaging/cyime-wayclip.service "$root/usr/share/cyime-wayclip/"
      sed 's#@bindir@#/usr/bin#g' packaging/cyime-wayclip.service > "$root/usr/lib/systemd/user/cyime-wayclip.service"
      tar -C "$root" -czf "dist/${artifact}.tar.gz" .
      mkdir -p debian/cyime-wayclip/DEBIAN debian/cyime-wayclip/usr/bin debian/cyime-wayclip/usr/lib/systemd/user
      cat > debian/cyime-wayclip/DEBIAN/control <<EOF
      Package: cyime-wayclip
      Version: $version
      Section: utils
      Priority: optional
      Architecture: amd64
      Maintainer: CyIME contributors
      Description: Wayland clipboard synchronization for CyIME
       Secure clipboard synchronization between a Wayland desktop and CyIME.
      EOF
      install -m755 target/release/cyime-wayclip debian/cyime-wayclip/usr/bin/
      sed 's#@bindir@#/usr/bin#g' packaging/cyime-wayclip.service > debian/cyime-wayclip/usr/lib/systemd/user/cyime-wayclip.service
      dpkg-deb --build debian/cyime-wayclip "dist/${artifact}.deb"
      mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
      tar -czf "rpmbuild/SOURCES/cyime-wayclip-${version}.tar.gz" --transform "s,^,cyime-wayclip-${version}/," --exclude=target --exclude=.git --exclude=dist --exclude=debian --exclude=rpmbuild .
      sed "s/^Version:.*/Version: $version/" packaging/rpm.spec > rpmbuild/SPECS/cyime-wayclip.spec
      rpmbuild --nodeps --define "_topdir $PWD/rpmbuild" -ba rpmbuild/SPECS/cyime-wayclip.spec
      rpm_path="$(find rpmbuild/RPMS -type f -name '*.rpm' -print -quit)"
      test -n "$rpm_path"
      install -m644 "$rpm_path" "dist/${artifact}.rpm"
   - uses: softprops/action-gh-release@v2
     with:
      files: dist/*
