[package]
name = "cyime-wayclip"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
base64 = "0.23"
hex = "0.4"
if-addrs = "0.13"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
thiserror = "2"
tiny_http = { version = "0.12", features = ["ssl-rustls"] }
rcgen = "0.13"
rustls = "0.23"
rustls-pemfile = "2"
libc = "0.2"
getrandom = "0.3"
mdns-sd = "0.20.3"
png = { version = "0.18", default-features = false }
wayland-protocols-wlr = { version = "0.3", features = ["client"], optional = true }

[dev-dependencies]
wayland-protocols = { version = "0.32", features = ["server", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["server"] }
wayland-server = "0.31"


[[bin]]
name = "cyime-wayclip"
path = "src/main.rs"

[features]
wayland = ["dep:wayland-client", "dep:wayland-protocols", "dep:wayland-protocols-wlr"]

[dependencies.wayland-client]
version = "0.31"
optional = true

[dependencies.wayland-protocols]
version = "0.32"
features = ["staging", "client"]
optional = true

[dependencies.qrcodegen]
version = "1.8"
