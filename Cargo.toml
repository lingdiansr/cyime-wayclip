[package]
name = "cyime-wayclip"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
base64 = "0.22"
hex = "0.4"
if-addrs = "0.13"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tiny_http = { version = "0.12", features = ["ssl-rustls"] }
rcgen = "0.13"
rustls = "0.23"

[dev-dependencies]


[[bin]]
name = "cyime-wayclip"
path = "src/main.rs"

[features]
wayland = ["dep:wayland-client", "dep:wayland-protocols", "dep:wl-clipboard-rs"]

[dependencies.wayland-client]
version = "0.31"
optional = true

[dependencies.wayland-protocols]
version = "0.32"
features = ["staging", "client"]
optional = true

[dependencies.wl-clipboard-rs]
version = "0.9"
optional = true

[dependencies.qrcodegen]
version = "1.8"
