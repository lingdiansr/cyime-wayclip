[package]
name = "cyime-wayclip"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
hex = "0.4"

[[bin]]
name = "cyime-wayclip"
path = "src/main.rs"

[features]
wayland = ["dep:wayland-client"]

[dependencies.wayland-client]
version = "0.31"
optional = true
